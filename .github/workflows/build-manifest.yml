name: Build content manifest

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar manifest.json
        run: node scripts/build-manifest.mjs

      - name: Salvar manifest.json no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "chore: atualizar manifest.json [skip ci]"
          git push
