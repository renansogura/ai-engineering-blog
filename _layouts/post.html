<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} — Caderno aberto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:    #FCFBF8;
    --ink:      #191C22;
    --ink-soft: #6B6F7A;
    --rule:     #E4E2DA;
    --rule-soft:#EFEDE6;
    --highlight:#FBE983;
    --indigo:   #2E3A6B;

    --display: 'Fraunces', Georgia, serif;
    --sans:    'IBM Plex Sans', system-ui, sans-serif;
    --mono:    'IBM Plex Mono', ui-monospace, monospace;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:1.06rem;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:var(--indigo); text-decoration:underline; text-underline-offset:3px; }
  a:hover{ color:var(--ink); }
  :focus-visible{ outline:2px solid var(--indigo); outline-offset:3px; border-radius:2px; }

  /* ── Cabeçalho de navegação ─── */
  .topbar{
    position:sticky; top:0; z-index:10;
    background:rgba(252,251,248,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--rule);
    padding:.7rem 0;
  }
  .topbar-inner{
    max-width:700px; margin:0 auto; padding:0 1.75rem;
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
  }
  .back{
    font-family:var(--mono); font-size:.75rem; letter-spacing:.09em;
    text-transform:uppercase; color:var(--ink-soft);
    text-decoration:none; display:flex; align-items:center; gap:.4rem;
    transition:color .16s ease;
  }
  .back:hover{ color:var(--ink); }
  .back::before{ content:'←'; font-size:.9rem; }
  .book-label{
    font-family:var(--mono); font-size:.72rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-soft);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:50%;
  }

  /* ── Corpo do artigo ─── */
  .wrap{
    max-width:700px; margin:0 auto;
    padding:4rem 1.75rem 6rem;
  }

  /* eyebrow */
  .eyebrow{
    font-family:var(--mono); font-size:.72rem; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-soft);
    margin:0 0 1.1rem; display:flex; align-items:center; gap:.6rem;
  }
  .eyebrow::after{
    content:''; flex:1; height:1px; background:var(--rule);
  }

  /* título principal */
  h1.titulo{
    font-family:var(--display);
    font-size:clamp(2.4rem, 6vw, 3.4rem);
    font-weight:700; line-height:1.06;
    letter-spacing:-.025em; margin:0 0 2.5rem;
    font-variation-settings:'SOFT' 40,'WONK' 1;
  }

  /* divisor antes do conteúdo */
  .divisor{
    border:none; border-top:2px solid var(--ink);
    margin:0 0 2.5rem; width:3rem; opacity:.18;
  }

  /* ── Conteúdo do .md ─── */
  .conteudo{ text-align:justify; hyphens:auto; }

  .conteudo h1,.conteudo h2{
    font-family:var(--display);
    font-weight:600; letter-spacing:-.018em;
    margin:2.8rem 0 .75rem; line-height:1.18;
    text-align:left;
  }
  .conteudo h1{ font-size:1.85rem; }
  .conteudo h2{ font-size:1.45rem; }

  .conteudo h3,.conteudo h4{
    font-family:var(--sans); font-weight:600;
    margin:2.2rem 0 .5rem; line-height:1.3;
    text-align:left;
  }
  .conteudo h3{ font-size:1.1rem; }
  .conteudo h4{ font-size:.98rem; text-transform:uppercase; letter-spacing:.05em; }

  .conteudo p{ margin:0 0 1.3rem; }

  .conteudo strong{ font-weight:600; }
  .conteudo em{ font-style:italic; }

  .conteudo blockquote{
    margin:1.8rem 0; padding:.9rem 1.25rem;
    border-left:3px solid var(--highlight);
    background:rgba(251,233,131,.15);
    font-style:italic; color:var(--ink-soft);
    text-align:left;
  }
  .conteudo blockquote p{ margin:0; }

  .conteudo code{
    font-family:var(--mono); font-size:.87em;
    background:var(--rule-soft); padding:.15em .4em;
    border-radius:3px; border:1px solid var(--rule);
  }
  .conteudo pre{
    background:var(--ink); color:#E8E6E0;
    padding:1.25rem 1.5rem; border-radius:6px;
    overflow-x:auto; margin:1.8rem 0;
    font-size:.88rem; line-height:1.6;
    text-align:left;
  }
  .conteudo pre code{
    background:none; border:none; padding:0;
    color:inherit; font-size:inherit;
  }

  .conteudo ul,.conteudo ol{
    padding-left:1.6rem; margin:0 0 1.3rem;
    text-align:left;
  }
  .conteudo li{ margin-bottom:.4rem; }
  .conteudo li::marker{ color:var(--ink-soft); }

  .conteudo hr{
    border:none; border-top:1px solid var(--rule);
    margin:2.5rem 0;
  }

  .conteudo img{
    max-width:100%; border-radius:4px;
    margin:1.5rem auto; display:block;
  }

  .conteudo table{
    width:100%; border-collapse:collapse;
    margin:1.8rem 0; font-size:.92rem;
    text-align:left;
  }
  .conteudo th{
    font-family:var(--mono); font-size:.75rem;
    letter-spacing:.08em; text-transform:uppercase;
    border-bottom:2px solid var(--ink);
    padding:.5rem .75rem; color:var(--ink-soft);
  }
  .conteudo td{
    border-bottom:1px solid var(--rule);
    padding:.55rem .75rem; vertical-align:top;
  }
  .conteudo tr:last-child td{ border-bottom:none; }

  /* ── Rodapé ─── */
  .rodape{
    margin-top:4rem; padding-top:1.5rem;
    border-top:1px solid var(--rule);
    font-family:var(--mono); font-size:.7rem;
    letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft);
  }

  @media (max-width:560px){
    .wrap{ padding:2.8rem 1.25rem 5rem; }
    h1.titulo{ font-size:2.1rem; }
    .book-label{ display:none; }
    .topbar-inner{ justify-content:flex-start; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<nav class="topbar">
  <div class="topbar-inner">
    <a class="back" href="{{ site.baseurl }}/">Caderno aberto</a>
    {% if page.book %}<span class="book-label">{{ page.book }}</span>{% endif %}
  </div>
</nav>

<article class="wrap">
  <p class="eyebrow">{{ page.category | default: "nota" }}{% if page.tema %} · {{ page.tema }}{% endif %}</p>
  <h1 class="titulo">{{ page.title }}</h1>
  <hr class="divisor">
  <div class="conteudo">
    {{ content }}
  </div>
  <footer class="rodape">Renan Seiichi Ogura · Caderno aberto</footer>
</article>

</body>
</html>
